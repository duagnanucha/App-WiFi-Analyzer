name: wifi_analyzer_pro
description: "WiFi Analyzer Pro - Scan, Analyze, Optimize your WiFi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # WiFi & Network
  wifi_scan: ^0.4.1
  network_info_plus: ^6.0.1
  permission_handler: ^11.3.1
  lan_scanner: ^4.0.0
  dart_ping: ^9.0.1
  flutter_internet_speed_test: ^2.0.0

  # UI & Charts
  fl_chart: ^0.69.0

  # Ads
  google_mobile_ads: ^5.2.0

  # Storage & Export
  hive: ^4.0.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  csv: ^6.0.0
  share_plus: ^10.0.3

  # State Management
  provider: ^6.1.2

  # Utilities
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.3

  # Web support
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
